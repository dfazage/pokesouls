name: music-fetch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd tools && cd .. && PYTHONPATH=tools python3 tools/oga_fetch.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add assets/audio/music tools/music_report.txt; git commit -m "Pistes OpenGameArt téléchargées et converties en OGG" || true; git push
